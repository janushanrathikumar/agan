# Builds the Windows till app.
#
# The shop's receipt printer only prints reliably when a program drives it
# directly instead of going through Chrome's print preview, so the till runs as
# a Windows desktop app. Development happens on a Mac, which cannot produce a
# Windows build, so GitHub's Windows runner does it.
#
# After a run finishes, download "RestaurantKleefeld-Windows" from the run's
# Artifacts section, unzip it on the shop computer and start restorant.exe.
name: Windows app

on:
  push:
    branches: [main, kitchen-bar-tables-qr]
    paths-ignore: ['**.md']
  workflow_dispatch: # lets you start a build by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version used
        run: flutter --version

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      # Stops a real error before it reaches the .exe. The warnings and lint
      # hints this codebase already carries are not made fatal, or no build
      # would ever run.
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      # The build log is only readable by someone signed in to GitHub, so a
      # failure also gets repeated as an annotation and kept as an artifact.
      - name: Build Windows app
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $msg = (Get-Content build.log -Tail 40) -join "`n"
            $msg = $msg.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows build failed::$msg"
            exit $code
          }

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore


      # Flutter has moved this folder between versions, so find it rather than
      # assuming, and fail loudly if the build produced nothing.
      - name: Collect the build
        shell: pwsh
        run: |
          $release = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
                     Where-Object { Test-Path (Join-Path $_.FullName 'restorant.exe') } |
                     Select-Object -First 1
          if (-not $release) { throw 'No Release folder with restorant.exe was produced.' }
          Write-Host "Found: $($release.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path (Join-Path $release.FullName '*') -Destination dist -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RestaurantKleefeld-Windows
          path: dist/
          if-no-files-found: error
